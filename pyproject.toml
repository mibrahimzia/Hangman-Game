[project]
name = "hangman"
version = "1.0.0"
description = "EF101-P01 Web-Based Hangman Game with persistent leaderboard (Python + Flask + Cloudflare D1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.3.0",
    "Flask-Limiter==4.1.1",
]

[project.optional-dependencies]
# Build-time / dev-only tools. These are NEVER deployed to Workers and are NOT
# runtime dependencies. wordfreq is used once to generate db_init.sql.
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "wordfreq>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[tool.pytest.ini_options]
testpaths = ["tests"]
