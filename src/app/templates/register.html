{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create an account</h1>
  <p class="dim">Accounts are optional, but they unlock your profile stats.</p>
  <form action="{{ url_for('auth.register') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">Username (3-20 chars: letters, numbers, _ . -)
      <input name="username" required autocomplete="username" maxlength="20">
    </label>
    <label class="field">Password (min 8 characters)
      <input name="password" type="password" required autocomplete="new-password" minlength="8">
    </label>
    <label class="field">Confirm password
      <input name="confirm" type="password" required autocomplete="new-password" minlength="8">
    </label>
    <button type="submit">Register</button>
  </form>
  <p class="dim">Already registered? <a href="{{ url_for('auth.login') }}">Login here.</a></p>
</section>
{% endblock %}
